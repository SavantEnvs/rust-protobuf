[package]
name = "mayhem-kat"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "kat"
path = "src/main.rs"

[dependencies]
protobuf = { path = "../../protobuf" }

# Standalone workspace: this crate is NOT a member of the upstream root workspace (nor did we
# add it there — that would be a non-additive edit). Without this table cargo would try to adopt
# the upstream root workspace for this manifest and fail with "current package believes it's in a
# workspace when it's not". `protobuf` (the path dependency) stays a normal out-of-workspace path
# dependency, same pattern as upstream's own test-crates/protobuf-fuzz/fuzz crate.
[workspace]
members = ["."]
